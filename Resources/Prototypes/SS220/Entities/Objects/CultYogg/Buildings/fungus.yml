- type: entity
  name: fungus hydroponic
  parent: BaseStructure
  #parent: SmallConstructibleMachine#ToDo maybe create our own parrent
  id: CultYoggFungusHydroponic
  suffix: CultYogg
  description: desc
  placement:
    mode: SnapgridCenter
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.1"
        density: 190
        hard: true
        mask:
        - MachineMask
        layer:
        - BulletImpassable
  - type: Sprite
    noRot: true
    sprite: SS220/Structures/CultYogg/fungus_hydroponic.rsi
    layers:
      - sprite: SS220/Structures/CultYogg/fungus_hydroponic.rsi
        state: base
        map: ["fungusMachineState"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FungusMachineVisuals.State:
        fungusMachineState:
          Empty: { state: base }
          Growing: { state: growing }
          Grown: { state: grown }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: WiresPanel
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Transform
  - type: PlantHolderVisuals
  - type: Fungus
    # Temporary development values: first harvest takes roughly 1-2 minutes.
    updateDelay: 1
    cycleDelay: 5
  - type: FungusMachine
    pack: CultYoggFungusInventory
  - type: CultYoggBuilding
    eraseTime: 5
    spawnOnErase:
      - id: LivingRootsStack1
        stackAmount: 10
      - id: SheetTokl1
        stackAmount: 10
  - type: ActivatableUI
    requiresComplex: false
    blockSpectators: true
    key: enum.FungusMachineUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FungusMachineUiKey.Key:
        type: FungusMachineBoundUserInterface
  - type: ContainerContainer
    containers:
      FungusMachine: !type:Container
        showEnts: False
  - type: Tag
    tags:
    - CultYoggStealthProvidable

- type: fungusMachineInventory
  id: CultYoggFungusInventory
  cultures:
  - id: MiGomyceteSeeds
    productId: FoodMiGomyceteCult
    name: seeds-migo-display-name
    description: cult-yogg-fungus-culture-migo-description
  - id: CultStrangeFruitSeed
    productId: ProductStrangeFruitCultYogg
    name: seeds-strange-fruit-display-name
    description: cult-yogg-fungus-culture-strange-fruit-description
  - id: NullificationShroomSeeds
    productId: FoodNullificationShroomCult
    name: seeds-null-shroom-display-name
    description: cult-yogg-fungus-culture-nullification-description
  - id: SidiousShroomSeeds
    productId: FoodSidiousShroomCult
    name: seeds-sidious-shroom-display-name
    description: cult-yogg-fungus-culture-sidious-description
  - id: LubroShroomSeeds
    productId: FoodLubroShroomCult
    name: seeds-lurbo-shroom-display-name
    description: cult-yogg-fungus-culture-lubro-description
  - id: MikoTrapShroomSeeds
    productId: FoodMikoTrapShroomCult
    name: seeds-miko-trap-shroom-display-name
    description: cult-yogg-fungus-culture-miko-trap-description

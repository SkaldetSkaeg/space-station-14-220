- type: entity
  id: GlovePrintScanner
  name: glove trace scanner
  parent: [BaseItem, BaseSecurityContraband]
  description: A portable scanner that collects glove traces or an item's own glove signature and dispenses a sample swab. Use it in hand to switch modes.
  components:
  - type: Sprite
    sprite: Objects/Tools/appraisal-tool.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/appraisal-tool.rsi
    size: Small
  - type: Clothing
    sprite: Objects/Tools/appraisal-tool.rsi
    quickEquip: false
    slots:
    - Belt
  - type: GlovePrintScanner
  - type: UnPlaceable
  - type: GuideHelp
    guides:
    - Forensics

- type: entity
  id: GlovePrintSwab
  name: glove trace swab
  parent: BaseItem
  description: A physical carrier for a glove trace sample. Insert a collected sample into a glove trace analyzer.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/mouth_swab.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: GlovePrintSwab
  - type: UnPlaceable
  - type: Tag
    tags:
    - GlovePrintSwab
  - type: GuideHelp
    guides:
    - Forensics

- type: entity
  id: BoxGlovePrintSwabs
  name: glove trace swab box
  parent: BoxCardboard
  description: A box containing ten empty glove trace sample swabs.
  components:
  - type: Sprite
    layers:
    - state: boxwide
    - state: swab
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Storage
    grid:
    - 0,0,4,1
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: GlovePrintSwab
        amount: 10
  - type: GuideHelp
    guides:
    - Forensics

- type: entity
  id: GlovePrintAnalyzer
  name: glove trace analyzer
  parent: [BaseMachine, BaseSecurityContraband]
  description: A machine that identifies the glove types and pair codes in a collected swab sample.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Machines/diagnoser.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
  - type: GlovePrintAnalyzer
  - type: DeviceLinkSource
    ports:
    - GlovePrintReport
  - type: ItemSlots
    slots:
      sampleSlot:
        name: glove-print-analyzer-slot-name
        whitelist:
          tags:
          - GlovePrintSwab
  - type: ContainerContainer
    containers:
      sampleSlot: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.GlovePrintAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GlovePrintAnalyzerUiKey.Key:
        type: GlovePrintAnalyzerBoundUserInterface
  - type: GuideHelp
    guides:
    - Forensics

- type: entity
  id: GlovePrintAnalyzerFlatpack
  name: glove trace analyzer flatpack
  parent: BaseFlatpack
  description: A flatpack for constructing a glove trace analyzer. Use a multitool to deploy it.
  components:
  - type: Item
    size: Normal
  - type: Flatpack
    entity: GlovePrintAnalyzer
  - type: GuideHelp
    guides:
    - Forensics

- type: entity
  id: GlovePrintReportPaper
  parent: PaperNtFormSec
  name: glove trace analysis report
  description: An official security department report identifying glove types and individual pair codes in an analyzed sample.
  components:
  - type: GuideHelp
    guides:
    - Forensics

- type: entity
  id: GlovePrintSwab
  name: glove trace swab
  parent: BaseItem
  description: A single-use swab for collecting glove traces from objects or sampling a pair of gloves.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/mouth_swab.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: GlovePrintSwab
  - type: UnPlaceable
  - type: Tag
    tags:
    - GlovePrintSwab
  - type: GuideHelp
    guides:
    - Forensics

- type: entity
  id: BoxGlovePrintSwabs
  name: glove trace swab dispenser
  parent: BaseAmmoProvider
  description: A dispenser containing ten single-use swabs for collecting glove traces.
  components:
  - type: Sprite
    layers:
    - state: boxwide
    - state: swab
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - GlovePrintSwab
    proto: GlovePrintSwab
    capacity: 10
  - type: GuideHelp
    guides:
    - Forensics

- type: entity
  id: GlovePrintAnalyzer
  name: glove trace analyzer
  parent: [BaseMachine, BaseSecurityContraband]
  description: A machine that identifies the glove types and pair codes in a collected swab sample.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Machines/diagnoser.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
  - type: GlovePrintAnalyzer
  - type: ItemSlots
    slots:
      sampleSlot:
        name: glove-print-analyzer-slot-name
        whitelist:
          tags:
          - GlovePrintSwab
  - type: ContainerContainer
    containers:
      sampleSlot: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.GlovePrintAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GlovePrintAnalyzerUiKey.Key:
        type: GlovePrintAnalyzerBoundUserInterface
  - type: GuideHelp
    guides:
    - Forensics

- type: entity
  id: GlovePrintAnalyzerFlatpack
  name: glove trace analyzer flatpack
  parent: BaseFlatpack
  description: A flatpack for constructing a glove trace analyzer. Use a multitool to deploy it.
  components:
  - type: Item
    size: Normal
  - type: Flatpack
    entity: GlovePrintAnalyzer
  - type: GuideHelp
    guides:
    - Forensics

  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: PackageDeliveryEmergencyToolboxTools
        - id: FoodBagelCotton
          prob: 0.15
        - id: HarmonicaInstrument
          prob: 0.15

- type: entity
  parent: ToolboxEmergency
  id: ToolboxEmergencyDeliveryCarnivoreFilled
  suffix: Filled, carnivore delivery
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: PackageDeliveryEmergencyToolboxTools
        - id: FoodDonkpocketDink
          prob: 0.15
        - id: HarmonicaInstrument
          prob: 0.15
